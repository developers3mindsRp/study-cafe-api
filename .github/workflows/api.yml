name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy API to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # Non-interactive SSH has a minimal PATH; Node may only exist after nvm/fnm or /etc/profile.d
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            if [ -f /etc/profile.d/nodejs.sh ]; then . /etc/profile.d/nodejs.sh; fi
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use default 2>/dev/null || nvm use node 2>/dev/null || true
            fi
            if [ -s "$HOME/.profile" ]; then . "$HOME/.profile"; fi
            if [ -f "$HOME/.asdf/asdf.sh" ]; then . "$HOME/.asdf/asdf.sh"; fi
            command -v npm >/dev/null 2>&1 || { echo "npm not on PATH; install system Node, or ensure nvm is in ~/.nvm and default node is nvm use --default; see server deploy docs."; exit 127; }

            cd /var/www/html/study-cafe-api

            git pull origin main

            npm install
            npm run install:all

            # One PM2 app per microservice (see ecosystem.config.cjs). First deploy: pm2 start; later: pm2 reload.
            if command -v pm2 >/dev/null 2>&1; then
              if pm2 list 2>/dev/null | grep -q studycafe-gateway; then
                pm2 reload ecosystem.config.cjs --update-env
              else
                pm2 start ecosystem.config.cjs
              fi
            fi