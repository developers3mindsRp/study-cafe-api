name: Deploy API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy API to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/html/study-cafe-api

            git pull origin main

            npm install
            npm run install:all

            # Redeploy Node services (use your process manager on the host). Examples:
            #   pm2 restart studycafe-ms
            #   systemctl restart studycafe-api
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart studycafe-ms 2>/dev/null || pm2 start npm --name studycafe-ms -- run start
            fi